    <script type="application/ld+json">

    <!-- UI Frameworks -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.9.2/dist/full.css" rel="stylesheet">

    <style>
        .orbital-nav {
            position: fixed;
            top: 50%;
            right: 2rem;
            transform: translateY(-50%);
            z-index: 1000;
        }

        .nav-item {
            position: absolute;
            width: 3.5rem;
            height: 3.5rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            cursor: pointer;
        }

        .nav-expand {
            transform: rotate(90deg);
            transition: 0.3s all ease;
        }

        .nav-expand.active {
            transform: rotate(0deg);
        }

        .section-highlighter {
            position: fixed;
            top: 50%;
            left: -15vw;
            width: 40vw;
            height: 40vw;
            background: radial-gradient(circle, rgba(59,130,246,0.1) 0%, rgba(59,130,246,0) 70%);
            transform: translateY(-50%);
            z-index: -1;
            transition: all 0.5s ease;
        }

        @media (max-width: 768px) {
            .orbital-nav {
                bottom: 1rem;
                top: auto;
                right: 50%;
                transform: translateX(50%);
            }

            .nav-item {
                position: static;
                margin: 0 0.5rem;
            }

            .nav-expand {
                display: none;
            }

            .section-highlighter {
                display: none;
            }
        }

        .insurance-card {
            transition: transform 0.3s, box-shadow 0.3s;
            perspective: 1000px;
        }

        .insurance-card:hover {
            transform: translateY(-5px) rotateX(5deg);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
    </style>
</head>

<body class="bg-gradient-to-br from-blue-50 to-indigo-50">

    <script>
        // Navigation Animation
        const navExpand = document.querySelector('.nav-expand');
        const navItems = document.querySelectorAll('.nav-item');
        const highlighter = document.querySelector('.section-highlighter');

        navExpand.addEventListener('click', () => {
            navExpand.classList.toggle('active');
            navItems.forEach((item, index) => {
                if (navExpand.classList.contains('active')) {
                    const angle = (index * 120 * Math.PI) / 180;
                    const radius = 100;
                    item.style.transform = `translate(${radius * Math.cos(angle)}px, ${radius * Math.sin(angle)}px)`;
                } else {
                    item.style.transform = 'translate(0, 0)';
                }
            });
        });

        // Section Highlighter Animation
        document.addEventListener('scroll', () => {
            const sections = document.querySelectorAll('section');
            let currentSection = '';
            
            sections.forEach(section => {
                const sectionTop = section.offsetTop;
                if (window.scrollY >= sectionTop - 300) {
                    currentSection = section.id;
                }
            });

            highlighter.style.transform = `translateY(-50%) scale(${currentSection ? 1 : 0})`;
            if (currentSection) {
                highlighter.style.left = `${document.querySelector(`#${currentSection}`).offsetLeft - 100}px`;
            }
        });

        // Maintain previous functionality
        const affiliateLinks = { /* ... */ };

    </script>
